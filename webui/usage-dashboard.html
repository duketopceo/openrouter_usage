<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenRouter Usage</title>
  <link rel="stylesheet" href="/plugins/openrouter_usage/webui/ui-kit.css" />
  <script type="module" src="/plugins/openrouter_usage/webui/usage-store.js"></script>
</head>
<body>
  <div x-data x-cloak>
    <template x-if="$store.openrouterUsageStore">
      <div x-init="$store.openrouterUsageStore.onOpen()" x-destroy="$store.openrouterUsageStore.cleanup()">

        <!-- Hero -->
        <div class="ui-hero">
          <img src="/plugins/openrouter_usage/docs/logo.webp" alt="" />
          <div class="ui-hero-titles">
            <div class="ui-hero-title">OpenRouter Usage</div>
            <div class="ui-hero-sub">
              <span x-text="$store.openrouterUsageStore.asOfLabel ? `Updated ${$store.openrouterUsageStore.asOfLabel}` : 'Loading…'"></span>
            </div>
          </div>
          <div class="ui-hero-side">
            <span class="ui-pill" x-show="$store.openrouterUsageStore.stale"><span class="ui-dot warn"></span>stale</span>
            <select class="ws-select"
                    x-show="$store.openrouterUsageStore.workspaces.length"
                    :value="$store.openrouterUsageStore.selectedWorkspaceId"
                    @change="$store.openrouterUsageStore.selectWorkspace($event.target.value)">
              <template x-for="ws in $store.openrouterUsageStore.workspaces" :key="ws.id">
                <option :value="ws.id" x-text="ws.name || ws.id"></option>
              </template>
            </select>
            <button type="button" class="ui-btn" @click="$store.openrouterUsageStore.fetchOverview({ force: true })" :disabled="$store.openrouterUsageStore.loading" x-text="$store.openrouterUsageStore.loading ? '…' : 'Refresh'"></button>
            <div class="ui-seg">
              <button type="button" class="ui-btn" :class="{ on: $store.openrouterUsageStore.view === 'simple' }" @click="$store.openrouterUsageStore.setView('simple')">Simple</button>
              <button type="button" class="ui-btn" :class="{ on: $store.openrouterUsageStore.view === 'detailed' }" @click="$store.openrouterUsageStore.setView('detailed')">Detailed</button>
            </div>
          </div>
        </div>

        <!-- Loading skeleton (first load) -->
        <template x-if="$store.openrouterUsageStore.loading && !$store.openrouterUsageStore.hasData">
          <div class="ui-kpis">
            <template x-for="i in 4" :key="i"><div class="ui-skel" style="height:84px"></div></template>
          </div>
        </template>

        <!-- Missing key -->
        <template x-if="$store.openrouterUsageStore.emptyState === 'missing_management_key'">
          <div class="ui-empty">
            <div class="big">No management key</div>
            <div class="sub">Add <code>OPENROUTER_MANAGEMENT_KEY</code> to Agent Zero Secrets, then refresh.</div>
          </div>
        </template>

        <!-- Fatal error -->
        <template x-if="$store.openrouterUsageStore.error && !$store.openrouterUsageStore.hasData">
          <div class="ui-banner bad" x-text="$store.openrouterUsageStore.error"></div>
        </template>

        <template x-if="$store.openrouterUsageStore.hasData">
          <div>
            <!-- KPI strip -->
            <div class="ui-kpis">
              <div class="ui-kpi accent">
                <div class="k-label" x-text="`Spend · ${$store.openrouterUsageStore.historyDays}d`"></div>
                <div class="k-value" x-text="$store.openrouterUsageStore.overview?.totals?.usd_label || '—'"></div>
                <div class="k-sub" x-text="$store.openrouterUsageStore.creditLine"></div>
              </div>
              <div class="ui-kpi">
                <div class="k-label">Credit balance</div>
                <div class="k-value" x-text="$store.openrouterUsageStore.overview?.credits?.balance_label || '—'"></div>
                <div class="k-sub" x-text="`Month ${$store.openrouterUsageStore.spendThisMonth}`"></div>
              </div>
              <div class="ui-kpi">
                <div class="k-label">Today</div>
                <div class="k-value" x-text="$store.openrouterUsageStore.spendToday"></div>
                <div class="k-sub" x-text="$store.openrouterUsageStore.activeWorkspaceName"></div>
              </div>
              <div class="ui-kpi" x-show="$store.openrouterUsageStore.topModel">
                <div class="k-label">Top model</div>
                <div class="k-value" x-text="$store.openrouterUsageStore.topModel?.model"></div>
                <div class="k-sub" x-text="$store.openrouterUsageStore.topModel?.total_usage_label"></div>
              </div>
              <div class="ui-kpi" x-show="$store.openrouterUsageStore.topKey">
                <div class="k-label">Top key</div>
                <div class="k-value" x-text="$store.openrouterUsageStore.topKey?.label"></div>
                <div class="k-sub" x-text="$store.openrouterUsageStore.topKey?.total_usage_label"></div>
              </div>
            </div>

            <!-- Simple view: sparkline + top lists -->
            <div x-show="$store.openrouterUsageStore.view === 'simple'">
              <div class="ui-card">
                <h3>Daily spend</h3>
                <div class="ui-spark">
                  <template x-for="day in ($store.openrouterUsageStore.overview?.daily || [])" :key="day.day || day.label">
                    <i :style="{ height: $store.openrouterUsageStore.barPct($store.openrouterUsageStore.totalDaily(day), $store.openrouterUsageStore.dailyMax) }" :title="`${day.label}: ${$store.openrouterUsageStore.fmtUsd($store.openrouterUsageStore.totalDaily(day))}`"></i>
                  </template>
                </div>
              </div>
              <div class="ui-split" style="margin-top:12px">
                <div class="ui-card">
                  <h3>Top models</h3>
                  <template x-for="row in ($store.openrouterUsageStore.overview?.top_models || []).slice(0, 6)" :key="row.model">
                    <div class="ui-bar-row">
                      <span class="ui-bar-label" x-text="row.model || 'unknown'"></span>
                      <div class="ui-bar-track"><div class="ui-bar-fill" :style="{ width: $store.openrouterUsageStore.barPct(row.total_usage ?? row.usd, $store.openrouterUsageStore.maxOf($store.openrouterUsageStore.overview.top_models, 'total_usage')) }"></div></div>
                      <span class="ui-bar-val" x-text="$store.openrouterUsageStore.fmtUsd(row.total_usage ?? row.usd)"></span>
                    </div>
                  </template>
                </div>
                <div class="ui-card">
                  <h3>Top keys</h3>
                  <template x-for="row in ($store.openrouterUsageStore.overview?.per_key || []).slice(0, 6)" :key="row.hash || row.label">
                    <div class="ui-bar-row">
                      <span class="ui-bar-label" x-text="row.label"></span>
                      <div class="ui-bar-track"><div class="ui-bar-fill c2" :style="{ width: $store.openrouterUsageStore.barPct(row.usd, $store.openrouterUsageStore.maxOf($store.openrouterUsageStore.overview.per_key, 'usd')) }"></div></div>
                      <span class="ui-bar-val" x-text="$store.openrouterUsageStore.fmtUsd(row.usd)"></span>
                    </div>
                  </template>
                </div>
              </div>
            </div>

            <!-- Detailed view -->
            <div x-show="$store.openrouterUsageStore.view === 'detailed'">
              <div class="ui-tabs">
                <template x-for="tab in $store.openrouterUsageStore.tabs" :key="tab.id">
                  <button type="button" class="ui-tab"
                          :class="{ on: $store.openrouterUsageStore.activeTab === tab.id }"
                          @click="$store.openrouterUsageStore.setTab(tab.id)"
                          x-text="tab.label"></button>
                </template>
              </div>

              <!-- Overview tab -->
              <div x-show="$store.openrouterUsageStore.activeTab === 'overview'">
                <div class="ui-split">
                  <div class="ui-card">
                    <h3>Daily spend</h3>
                    <div class="ui-spark">
                      <template x-for="day in ($store.openrouterUsageStore.overview?.daily || [])" :key="day.day || day.label">
                        <i :style="{ height: $store.openrouterUsageStore.barPct($store.openrouterUsageStore.totalDaily(day), $store.openrouterUsageStore.dailyMax) }" :title="`${day.label}: ${$store.openrouterUsageStore.fmtUsd($store.openrouterUsageStore.totalDaily(day))}`"></i>
                      </template>
                    </div>
                  </div>
                  <div class="ui-card">
                    <h3>Top providers</h3>
                    <template x-for="row in ($store.openrouterUsageStore.overview?.top_providers || []).slice(0, 6)" :key="row.provider">
                      <div class="ui-bar-row">
                        <span class="ui-bar-label" x-text="row.provider || 'unknown'"></span>
                        <div class="ui-bar-track"><div class="ui-bar-fill c3" :style="{ width: $store.openrouterUsageStore.barPct(row.total_usage ?? row.usd, $store.openrouterUsageStore.maxOf($store.openrouterUsageStore.overview.top_providers, 'total_usage')) }"></div></div>
                        <span class="ui-bar-val" x-text="$store.openrouterUsageStore.fmtUsd(row.total_usage ?? row.usd)"></span>
                      </div>
                    </template>
                  </div>
                </div>
                <div class="ui-split" style="margin-top:12px">
                  <div class="ui-card">
                    <h3>Top apps</h3>
                    <template x-for="row in ($store.openrouterUsageStore.overview?.top_apps || []).slice(0, 6)" :key="row.app">
                      <div class="ui-bar-row">
                        <span class="ui-bar-label" x-text="row.app || 'unknown'"></span>
                        <div class="ui-bar-track"><div class="ui-bar-fill c4" :style="{ width: $store.openrouterUsageStore.barPct(row.total_usage ?? row.usd, $store.openrouterUsageStore.maxOf($store.openrouterUsageStore.overview.top_apps, 'total_usage')) }"></div></div>
                        <span class="ui-bar-val" x-text="$store.openrouterUsageStore.fmtUsd(row.total_usage ?? row.usd)"></span>
                      </div>
                    </template>
                  </div>
                  <div class="ui-card">
                    <h3>Per-key totals</h3>
                    <div class="ui-table-wrap">
                      <table class="ui-table">
                        <thead><tr>
                          <th>Key</th><th>USD</th>
                          <th x-show="$store.openrouterUsageStore.overview?.settings?.show_token_counts">Prompt</th>
                          <th x-show="$store.openrouterUsageStore.overview?.settings?.show_token_counts">Completion</th>
                          <th>Req</th>
                        </tr></thead>
                        <tbody>
                          <template x-for="row in ($store.openrouterUsageStore.overview?.per_key || [])" :key="row.hash || row.hash_prefix || row.label">
                            <tr>
                              <td x-text="row.label"></td>
                              <td x-text="$store.openrouterUsageStore.fmtUsd(row.usd)"></td>
                              <td x-show="$store.openrouterUsageStore.overview?.settings?.show_token_counts" x-text="$store.openrouterUsageStore.fmtNum(row.prompt_tokens)"></td>
                              <td x-show="$store.openrouterUsageStore.overview?.settings?.show_token_counts" x-text="$store.openrouterUsageStore.fmtNum(row.completion_tokens)"></td>
                              <td x-text="$store.openrouterUsageStore.fmtNum(row.requests)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Spend tab -->
              <div x-show="$store.openrouterUsageStore.activeTab === 'spend'">
                <div class="ui-card">
                  <h3>Daily spend</h3>
                  <template x-for="day in ($store.openrouterUsageStore.overview?.daily || [])" :key="day.day || day.label">
                    <div class="ui-bar-row">
                      <span class="ui-bar-label" x-text="day.label"></span>
                      <div class="ui-bar-track"><div class="ui-bar-fill" :style="{ width: $store.openrouterUsageStore.barPct($store.openrouterUsageStore.totalDaily(day), $store.openrouterUsageStore.dailyMax) }"></div></div>
                      <span class="ui-bar-val" x-text="$store.openrouterUsageStore.fmtUsd($store.openrouterUsageStore.totalDaily(day))"></span>
                    </div>
                  </template>
                </div>
                <div class="ui-card" style="margin-top:12px">
                  <h3>Spend by key</h3>
                  <template x-for="row in ($store.openrouterUsageStore.overview?.per_key || [])" :key="row.hash || row.hash_prefix || row.label">
                    <div class="ui-bar-row">
                      <span class="ui-bar-label" x-text="row.label"></span>
                      <div class="ui-bar-track"><div class="ui-bar-fill c2" :style="{ width: $store.openrouterUsageStore.barPct(row.usd, $store.openrouterUsageStore.maxOf($store.openrouterUsageStore.overview.per_key, 'usd')) }"></div></div>
                      <span class="ui-bar-val" x-text="$store.openrouterUsageStore.fmtUsd(row.usd)"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Analytics tabs -->
              <template x-for="t in [
                { id: 'models', dim: 'model', cols: [['Usage', 'total_usage', 'usd'], ['Requests', 'request_count', 'num'], ['Prompt tok', 'tokens_prompt', 'num'], ['Completion tok', 'tokens_completion', 'num']] },
                { id: 'providers', dim: 'provider', cols: [['Usage', 'total_usage', 'usd'], ['Requests', 'request_count', 'num'], ['Avg latency', 'avg_latency', 'ms'], ['P90 latency', 'p90_latency', 'ms'], ['Avg tput', 'avg_throughput', 'num2']] },
                { id: 'apps', dim: 'app', cols: [['Usage', 'total_usage', 'usd'], ['Requests', 'request_count', 'num']] },
                { id: 'workspaces', dim: 'workspace', cols: [['Usage', 'total_usage', 'usd'], ['Requests', 'request_count', 'num']] }
              ]" :key="t.id">
                <div x-show="$store.openrouterUsageStore.activeTab === t.id">
                  <div x-show="$store.openrouterUsageStore.loadingTabs" class="ui-kpis"><template x-for="i in 3" :key="i"><div class="ui-skel" style="height:64px"></div></template></div>
                  <div class="ui-table-wrap" x-show="!$store.openrouterUsageStore.loadingTabs">
                    <table class="ui-table">
                      <thead>
                        <tr><th x-text="t.id === 'models' ? 'Model' : t.id === 'providers' ? 'Provider' : t.id === 'apps' ? 'App' : 'Workspace'"></th><template x-for="c in t.cols" :key="c[1]"><th x-text="c[0]"></th></template></tr>
                      </thead>
                      <tbody>
                        <template x-for="row in $store.openrouterUsageStore.analyticsRows" :key="row.dimensions?.[t.dim] || JSON.stringify(row.dimensions)">
                          <tr>
                            <td x-text="row.dimensions?.[t.dim] || '—'"></td>
                            <template x-for="c in t.cols" :key="c[1]">
                              <td x-text="c[2] === 'usd' ? $store.openrouterUsageStore.fmtUsd(row.metrics?.[c[1]]) : c[2] === 'ms' ? $store.openrouterUsageStore.fmtMs(row.metrics?.[c[1]]) : $store.openrouterUsageStore.fmtNum(row.metrics?.[c[1]], c[2] === 'num2' ? 2 : 0)"></td>
                            </template>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <div class="ui-empty" x-show="!$store.openrouterUsageStore.analyticsRows.length && !$store.openrouterUsageStore.loadingTabs"><div class="sub">No rows for this period.</div></div>
                  </div>
                </div>
              </template>

              <!-- Keys tab -->
              <div x-show="$store.openrouterUsageStore.activeTab === 'keys'">
                <div x-show="$store.openrouterUsageStore.loadingTabs" class="ui-kpis"><template x-for="i in 3" :key="i"><div class="ui-skel" style="height:64px"></div></template></div>
                <div class="ui-table-wrap" x-show="!$store.openrouterUsageStore.loadingTabs">
                  <table class="ui-table">
                    <thead><tr><th>Key</th><th>Usage</th><th>Requests</th></tr></thead>
                    <tbody>
                      <template x-for="row in $store.openrouterUsageStore.analyticsRows" :key="row.dimensions?.api_key_id || JSON.stringify(row.dimensions)">
                        <tr>
                          <td x-text="$store.openrouterUsageStore.keyLabel(row.dimensions?.api_key_id || row.dimensions?.key)"></td>
                          <td x-text="$store.openrouterUsageStore.fmtUsd(row.metrics?.total_usage)"></td>
                          <td x-text="$store.openrouterUsageStore.fmtNum(row.metrics?.request_count)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="ui-empty" x-show="!$store.openrouterUsageStore.analyticsRows.length && !$store.openrouterUsageStore.loadingTabs"><div class="sub">No rows for this period.</div></div>
                </div>
              </div>

              <!-- Activity tab -->
              <div x-show="$store.openrouterUsageStore.activeTab === 'activity'">
                <div class="ui-table-wrap">
                  <table class="ui-table">
                    <thead><tr><th>Date</th><th>Model</th><th>Provider</th><th>Requests</th><th>Usage</th></tr></thead>
                    <tbody>
                      <template x-for="row in ($store.openrouterUsageStore.overview?.activity || [])" :key="(row.date || '') + (row.model || '') + (row.provider_name || '') + (row.requests || 0)">
                        <tr>
                          <td x-text="row.date ? new Date(row.date).toLocaleDateString() : '—'"></td>
                          <td x-text="row.model || row.model_permaslug || '—'"></td>
                          <td x-text="row.provider_name || '—'"></td>
                          <td x-text="$store.openrouterUsageStore.fmtNum(row.requests)"></td>
                          <td x-text="$store.openrouterUsageStore.fmtUsd(row.usage)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="ui-empty" x-show="!($store.openrouterUsageStore.overview?.activity || []).length"><div class="sub">No recent activity.</div></div>
                </div>
              </div>

              <!-- Budgets tab -->
              <div x-show="$store.openrouterUsageStore.activeTab === 'budgets'">
                <div x-show="$store.openrouterUsageStore.loadingTabs" class="ui-kpis"><template x-for="i in 3" :key="i"><div class="ui-skel" style="height:64px"></div></template></div>
                <div class="ui-table-wrap" x-show="!$store.openrouterUsageStore.loadingTabs">
                  <table class="ui-table">
                    <thead><tr><th>Interval</th><th>Limit</th><th>Usage</th><th>Remaining</th><th>Reset</th></tr></thead>
                    <tbody>
                      <template x-for="row in ($store.openrouterUsageStore.budgets.length ? $store.openrouterUsageStore.budgets : ($store.openrouterUsageStore.overview?.budgets || []))" :key="row.interval">
                        <tr>
                          <td x-text="row.interval || '—'"></td>
                          <td x-text="$store.openrouterUsageStore.fmtUsd(row.limit)"></td>
                          <td x-text="$store.openrouterUsageStore.fmtUsd(row.usage)"></td>
                          <td x-text="$store.openrouterUsageStore.fmtUsd(row.limit_remaining)"></td>
                          <td x-text="row.limit_reset || '—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="ui-empty" x-show="!($store.openrouterUsageStore.budgets.length || ($store.openrouterUsageStore.overview?.budgets || []).length) && !$store.openrouterUsageStore.loadingTabs"><div class="sub">No budgets configured for this workspace.</div></div>
                </div>
              </div>

              <!-- Routing (ORI) tab -->
              <div x-show="$store.openrouterUsageStore.activeTab === 'routing'">
                <div x-show="$store.openrouterUsageStore.loadingTabs" class="ui-kpis"><template x-for="i in 3" :key="i"><div class="ui-skel" style="height:64px"></div></template></div>
                <template x-if="!$store.openrouterUsageStore.routing && !$store.openrouterUsageStore.loadingTabs">
                  <div class="ui-empty">
                    <div class="big">Routing harness</div>
                    <div class="sub">Preview a routing recommendation for this workspace.</div>
                    <button type="button" class="ui-btn primary" style="margin-top:12px" @click="$store.openrouterUsageStore.fetchRouting()">Preview recommendation</button>
                  </div>
                </template>
                <template x-if="$store.openrouterUsageStore.routing">
                  <div>
                    <div class="ui-split">
                      <div class="ui-card">
                        <h3>Current defaults</h3>
                        <div class="kpi-mono" x-text="$store.openrouterUsageStore.routing.current?.default_text_model || '—'"></div>
                        <div class="sub" x-text="`Image: ${$store.openrouterUsageStore.routing.current?.default_image_model || '—'}`"></div>
                        <div class="sub" x-text="`Providers: ${($store.openrouterUsageStore.routing.current?.default_provider_sort || []).join(', ') || '—'}`"></div>
                      </div>
                      <div class="ui-card">
                        <h3>Recommended</h3>
                        <div class="kpi-mono" x-text="$store.openrouterUsageStore.routing.recommended?.default_text_model || '—'"></div>
                        <div class="sub" x-text="`Image: ${$store.openrouterUsageStore.routing.recommended?.default_image_model || '—'}`"></div>
                        <div class="sub" x-text="`Providers: ${($store.openrouterUsageStore.routing.recommended?.default_provider_sort || []).join(', ') || '—'}`"></div>
                      </div>
                      <div class="ui-card">
                        <h3>Confidence</h3>
                        <span class="ui-pill" :class="{ good: $store.openrouterUsageStore.routing.confidence === 'high', warn: $store.openrouterUsageStore.routing.confidence === 'medium', bad: $store.openrouterUsageStore.routing.confidence === 'low' }" x-text="$store.openrouterUsageStore.routing.confidence || '—'"></span>
                        <div class="sub" style="margin-top:8px" x-text="$store.openrouterUsageStore.routing.note || ''"></div>
                      </div>
                    </div>

                    <div class="ui-card" style="margin-top:12px" x-show="$store.openrouterUsageStore.routing.tradeoffs && Object.keys($store.openrouterUsageStore.routing.tradeoffs).length">
                      <h3>Tradeoffs</h3>
                      <div class="ui-kpis" style="margin:0">
                        <div class="ui-kpi"><div class="k-label">Cost / 1M tok</div>
                          <div class="k-value" x-text="`${$store.openrouterUsageStore.fmtUsd($store.openrouterUsageStore.routing.tradeoffs?.current_cost_per_mtok)} → ${$store.openrouterUsageStore.fmtUsd($store.openrouterUsageStore.routing.tradeoffs?.recommended_cost_per_mtok)}`"></div>
                          <div class="k-sub" x-text="`${($store.openrouterUsageStore.routing.tradeoffs?.cost_change_pct >= 0 ? '+' : '')}${$store.openrouterUsageStore.fmtNum($store.openrouterUsageStore.routing.tradeoffs?.cost_change_pct, 1)}%`"></div>
                        </div>
                        <div class="ui-kpi"><div class="k-label">Latency</div>
                          <div class="k-value" x-text="`${$store.openrouterUsageStore.fmtMs($store.openrouterUsageStore.routing.tradeoffs?.current_avg_latency_ms)} → ${$store.openrouterUsageStore.fmtMs($store.openrouterUsageStore.routing.tradeoffs?.recommended_avg_latency_ms)}`"></div>
                          <div class="k-sub" x-text="`${($store.openrouterUsageStore.routing.tradeoffs?.latency_change_pct >= 0 ? '+' : '')}${$store.openrouterUsageStore.fmtNum($store.openrouterUsageStore.routing.tradeoffs?.latency_change_pct, 1)}%`"></div>
                        </div>
                        <div class="ui-kpi"><div class="k-label">Throughput</div>
                          <div class="k-value" x-text="`${$store.openrouterUsageStore.fmtNum($store.openrouterUsageStore.routing.tradeoffs?.current_avg_throughput, 2)} → ${$store.openrouterUsageStore.fmtNum($store.openrouterUsageStore.routing.tradeoffs?.recommended_avg_throughput, 2)}`"></div>
                          <div class="k-sub" x-text="`${($store.openrouterUsageStore.routing.tradeoffs?.throughput_change_pct >= 0 ? '+' : '')}${$store.openrouterUsageStore.fmtNum($store.openrouterUsageStore.routing.tradeoffs?.throughput_change_pct, 1)}%`"></div>
                        </div>
                        <div class="ui-kpi"><div class="k-label">Cache hit</div>
                          <div class="k-value" x-text="`${$store.openrouterUsageStore.fmtNum(($store.openrouterUsageStore.routing.tradeoffs?.current_cache_hit_rate || 0) * 100, 1)}% → ${$store.openrouterUsageStore.fmtNum(($store.openrouterUsageStore.routing.tradeoffs?.recommended_cache_hit_rate || 0) * 100, 1)}%`"></div>
                          <div class="k-sub" x-text="`${($store.openrouterUsageStore.routing.tradeoffs?.cache_hit_change_pct >= 0 ? '+' : '')}${$store.openrouterUsageStore.fmtNum($store.openrouterUsageStore.routing.tradeoffs?.cache_hit_change_pct, 1)}%`"></div>
                        </div>
                      </div>
                    </div>

                    <div class="ui-actions">
                      <button type="button" class="ui-btn" @click="$store.openrouterUsageStore.fetchRouting()">Refresh preview</button>
                      <button type="button" class="ui-btn primary"
                              x-show="$store.openrouterUsageStore.routing?.confidence !== 'low'"
                              :disabled="$store.openrouterUsageStore.applying"
                              @click="$store.openrouterUsageStore.requestApply()"
                              x-text="$store.openrouterUsageStore.applying ? 'Applying…' : 'Apply recommendation'"></button>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Alerts -->
            <template x-for="alert in ($store.openrouterUsageStore.overview?.alerts || [])" :key="alert.message">
              <div class="ui-banner warn" x-text="alert.message"></div>
            </template>
            <template x-if="$store.openrouterUsageStore.overview?.last_error">
              <div class="ui-banner warn" x-text="$store.openrouterUsageStore.overview.last_error"></div>
            </template>
          </div>
        </template>

        <!-- ORI apply confirmation -->
        <template x-if="$store.openrouterUsageStore.confirmApply">
          <div class="ui-overlay" @click.self="$store.openrouterUsageStore.cancelApply()">
            <div class="ui-dialog">
              <h3>Apply routing defaults?</h3>
              <p>
                This PATCHes workspace
                <strong x-text="$store.openrouterUsageStore.activeWorkspaceName"></strong>
                with the recommended defaults:
                <code x-text="$store.openrouterUsageStore.routing?.recommended?.default_text_model"></code>
                (image: <code x-text="$store.openrouterUsageStore.routing?.recommended?.default_image_model || '—'"></code>),
                provider sort
                <code x-text="($store.openrouterUsageStore.routing?.recommended?.default_provider_sort || []).join(', ') || '—'"></code>.
              </p>
              <div class="row">
                <button type="button" class="ui-btn" @click="$store.openrouterUsageStore.cancelApply()">Cancel</button>
                <button type="button" class="ui-btn danger" @click="$store.openrouterUsageStore.applyRouting()">Apply</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>
  </div>

  <style>
    .ws-select { min-height: 36px; font-size: 0.85rem; border: 1px solid var(--ui-border); border-radius: var(--ui-radius-sm); background: var(--ui-surface); color: inherit; padding: 0 10px; max-width: 220px; }
    .kpi-mono { font-weight: 800; font-size: 1rem; word-break: break-word; }
    .sub { opacity: 0.75; font-size: 0.78rem; margin-top: 4px; }
  </style>
</body>
</html>
