<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenRouter Usage</title>
  <link rel="stylesheet" href="/plugins/openrouter_usage/webui/ui-kit.css" />
  <script type="module" src="/plugins/openrouter_usage/webui/usage-store.js"></script>
</head>
<body>
  <div x-data x-init="$store.openrouterUsageStore && $store.openrouterUsageStore.fetchWorkspaces()">
    <div class="ui-hero">
      <img src="/plugins/openrouter_usage/docs/logo.webp" alt="" />
      <div class="ui-hero-titles">
        <div class="ui-hero-title">OpenRouter Usage</div>
        <div class="ui-hero-sub">Workspace spend, per-key usage, budgets, and routing recommendations.</div>
      </div>
      <div class="ui-hero-side">
        <span class="ui-pill" :class="{ good: $store.openrouterUsageStore?.hasData, warn: !$store.openrouterUsageStore?.hasData }">
          <span class="ui-dot" :class="{ good: $store.openrouterUsageStore?.hasData, warn: !$store.openrouterUsageStore?.hasData }"></span>
          <span x-text="$store.openrouterUsageStore?.hasData ? 'Connected' : 'No data'"></span>
        </span>
      </div>
    </div>

    <div class="ui-banner">
      <span>🔑</span>
      <span>Management key lives in <strong>Agent Zero Secrets</strong> as <code>OPENROUTER_MANAGEMENT_KEY</code> — never in this file.</span>
    </div>

    <div class="ui-card" style="margin-top:12px">
      <h3>Workspace</h3>
      <label class="ui-field">
        <span class="f-title">Pinned workspace</span>
        <span class="f-desc">Default scope for the dashboard. Empty = first workspace.</span>
        <div style="display:flex; gap:8px">
          <select x-model="config.pinned_workspace_id" style="flex:1">
            <option value="">No pin (first workspace)</option>
            <template x-for="ws in ($store.openrouterUsageStore?.workspaces || [])" :key="ws.id">
              <option :value="ws.id" x-text="ws.name || ws.id"></option>
            </template>
          </select>
          <button type="button" class="ui-btn" @click="$store.openrouterUsageStore.fetchWorkspaces()">Load</button>
        </div>
      </label>
    </div>

    <div class="ui-card" style="margin-top:12px">
      <h3>Keys</h3>
      <label class="ui-field">
        <span class="f-title">Watched keys</span>
        <span class="f-desc">Checked keys get per-key activity fetched (more detail, more API calls). Empty = aggregate only.</span>
        <div style="display:flex; gap:8px">
          <button type="button" class="ui-btn" @click="$store.openrouterUsageStore.fetchKeys()">Fetch keys</button>
        </div>
      </label>
      <div class="key-list" x-show="($store.openrouterUsageStore?.availableKeys || []).length">
        <template x-for="row in $store.openrouterUsageStore.availableKeys" :key="row.hash_prefix">
          <label class="key-row">
            <input type="checkbox"
                   :checked="$store.openrouterUsageStore.isWatched(row.hash_prefix, config)"
                   @change="$store.openrouterUsageStore.toggleWatch(row.hash_prefix, config)" />
            <span x-text="`${row.label} (${row.hash_prefix})`"></span>
            <span class="ui-chip" x-show="row.disabled">disabled</span>
          </label>
        </template>
      </div>
      <label class="ui-field">
        <span class="f-title">Key aliases</span>
        <span class="f-desc"><code>hashprefix=name</code>, one per line or comma-separated.</span>
        <textarea rows="3" x-model="config.key_aliases" placeholder="821713b8=luke,abc12345=helpdesk"></textarea>
      </label>
    </div>

    <div class="ui-card" style="margin-top:12px">
      <h3>Refresh &amp; window</h3>
      <div class="ui-grid2">
        <label class="ui-field">
          <span class="f-title">Refresh (min)</span>
          <input type="number" min="1" x-model.number="config.refresh_interval_minutes" />
        </label>
        <label class="ui-field">
          <span class="f-title">History (days)</span>
          <input type="number" min="1" max="365" x-model.number="config.history_days" />
        </label>
        <label class="ui-field">
          <span class="f-title">Burn window (days)</span>
          <input type="number" min="1" max="90" x-model.number="config.burn_window_days" />
        </label>
        <label class="ui-field">
          <span class="f-title">Budget alert at</span>
          <input type="number" min="0" max="1" step="0.05" x-model.number="config.budget_alert_threshold" />
        </label>
      </div>
      <div class="ui-grid2" style="margin-top:8px">
        <label class="ui-field">
          <span class="f-title">Default view</span>
          <select x-model="config.default_view">
            <option value="simple">Simple</option>
            <option value="detailed">Detailed</option>
          </select>
        </label>
        <label class="ui-field inline">
          <input type="checkbox" x-model="config.show_token_counts" />
          <span class="f-title">Show token counts</span>
        </label>
      </div>
    </div>

    <div class="ui-actions">
      <button type="button" class="ui-btn primary" @click="$store.openrouterUsageStore.fetchOverview({ force: true })">Refresh data now</button>
    </div>
  </div>

  <style>
    .key-list { display: grid; gap: 6px; max-height: min(220px, 40vh); overflow: auto; margin-top: 8px; }
    .key-row { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; min-height: 40px; padding: 4px 8px; border-radius: 8px; }
    .key-row:hover { background: var(--ui-surface); }
  </style>
</body>
</html>
